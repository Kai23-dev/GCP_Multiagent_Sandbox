# Agent/ADK CI Templates Pipeline
# Validates, tests, and releases GitLab CI templates
include:
  - project: shared-services/renovate
    ref: v0.9.2
    file: renovate-group.gitlab-ci.yml
  - project: shared-services/terraform
    ref: v445.0.0
    file: 
      - /terraform/1.x/templates/default-infra-gitlab-ci.yml # default infra ci
      - /terraform/1.x/templates/static-env-antipattern.yml # static env antipattern ci
  - project: shared-services/techstack/docker
    ref: v1.13.4  # replace with the latest version tag <https://gitlab.gcp.davita.com/shared-services/techstack/docker/-/tags>
    file: linux-container-build.gitlab-ci.yml

variables:
  DOCKER_PATH: web-app
  # LET_ME_STOP_STATIC: "true"
  TF_VAR_gitlab_project_path_slug: $CI_PROJECT_PATH_SLUG


"infra: master review":
  script:
    - exit 0

"infra: review":
  environment:
    name: review/${INFRA_DIRECTORY}/$CI_COMMIT_REF_NAME
    on_stop: 'infra: stop'
    auto_stop_in: never

".infra::config":
  before_script_post:
    - !reference [.foundation-pipeline::hash-directory, script]
    - !reference [.common-docker-scripts::image-tags-and-labels, script]
    - |
      set -eux
      # Hash directories for Docker images
      TRACE_VIEWER_HASH=$(hash_directory trace-viewer)

      # Export Terraform variables for image tags
      export TF_VAR_image_tag="${CI_REGISTRY_IMAGE}:${IMAGE_TAG_REF}"
      echo "==> Set TF_VAR_image_tag to '${TF_VAR_image_tag}'"
      export TF_VAR_trace_viewer_image_tag="${CI_REGISTRY_IMAGE}/trace-viewer:${TRACE_VIEWER_HASH}"
      echo "==> Set TF_VAR_trace_viewer_image_tag to '${TF_VAR_trace_viewer_image_tag}'"

'.infra: static default':
  parallel:
    matrix:
      - STATIC_ENV: dev
      - STATIC_ENV: stage

# Ensure Terraform waits for Docker builds to complete before deploying
"infra: review":
  needs:
    - job: 'infra: master review'
      artifacts: true
    - job: 'docker::package::trace-viewer-np'
      optional: true
      artifacts: false
  environment:
    name: review/${INFRA_DIRECTORY}/$CI_COMMIT_REF_NAME
    on_stop: 'infra: stop'
    auto_stop_in: never

# Trace Viewer — Non-Production Docker build
'docker::package::trace-viewer-np':
  extends: '.docker::package'
  variables:
    DOCKER_PATH: trace-viewer
    IMAGE_NAME: trace-viewer
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    HASH_DIRS: trace-viewer
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - trace-viewer/**/*

# Trace Viewer — Production Docker publish
'docker::publish-image-tag::trace-viewer-p':
  extends: '.docker::publish-image-tag'
  variables:
    DOCKER_PATH: trace-viewer
    IMAGE_NAME: trace-viewer
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    HASH_DIRS: trace-viewer
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - trace-viewer/**/*
